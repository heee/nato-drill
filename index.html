<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NATO Drill">
  <meta name="theme-color" content="#2E3420">
  <meta name="description" content="Drill the NATO phonetic alphabet with swipeable flashcards. Works offline.">
  <title>NATO Drill</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="preload" href="fonts/black-ops-one-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main" class="app">
    <header class="topbar">
      <div class="top-left" aria-live="polite">
        <div class="label" id="cardLabel">CARD · 0 / 5</div>
        <div class="segs" id="cardSegs" aria-hidden="true">
          <span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
        </div>
      </div>
      <button class="top-right" id="overallBtn" type="button" aria-haspopup="dialog">
        <span class="label" id="overallLabel">MASTERED · 0 / 26</span>
        <span class="bar" aria-hidden="true"><span class="bar-fill" id="overallFill"></span></span>
      </button>
    </header>
    <div class="stage" id="stage"></div>
  </main>

  <div class="sheet" id="sheet" inert>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <section class="sheet-panel" id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <header class="sheet-head" id="sheetHead">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-title-row">
          <h2 id="sheetTitle">MISSION LOG</h2>
          <button class="close" id="closeBtn" type="button" aria-label="Close">✕</button>
        </div>
        <div class="sheet-count">
          <span id="sheetCount">0 / 26 MASTERED</span>
          <span id="sheetTrained">0 TRAINED</span>
        </div>
        <div class="bar" aria-hidden="true"><div class="bar-fill" id="sheetFill"></div></div>
      </header>
      <div class="sheet-body">
        <div class="grid" id="grid"></div>
        <div class="actions">
          <button type="button" class="btn" id="exportBtn">EXPORT PROGRESS</button>
          <button type="button" class="btn" id="importBtn">IMPORT PROGRESS</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <div class="status" id="status" aria-live="polite">CHECKING OFFLINE…</div>
        <button type="button" class="btn reset" id="resetBtn">RESET PROGRESS</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
